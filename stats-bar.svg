<svg width="900" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes count-up { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes bar-fill { 0% { width: 0; } }
      @keyframes pulse-dot { 0%, 100% { r: 3; opacity: 0.8; } 50% { r: 5; opacity: 1; } }
    </style>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B2FBE"/>
      <stop offset="100%" stop-color="#bf91f7"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7DF1E"/>
      <stop offset="100%" stop-color="#f0c040"/>
    </linearGradient>
  </defs>

  <rect width="900" height="100" fill="#0D1117"/>

  <!-- Card backgrounds -->
  <rect x="15" y="10" width="200" height="80" rx="8" fill="#161B22" stroke="#21262d" stroke-width="0.5"/>
  <rect x="235" y="10" width="200" height="80" rx="8" fill="#161B22" stroke="#21262d" stroke-width="0.5"/>
  <rect x="455" y="10" width="200" height="80" rx="8" fill="#161B22" stroke="#21262d" stroke-width="0.5"/>
  <rect x="675" y="10" width="210" height="80" rx="8" fill="#161B22" stroke="#21262d" stroke-width="0.5"/>

  <!-- Card 1: Mobile Apps -->
  <g style="animation: count-up 0.6s ease 0.2s both;">
    <circle cx="40" cy="38" r="3" fill="#00D4FF">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="35" font-family="monospace" font-size="9" fill="#8892A4" letter-spacing="1">APPS BUILT</text>
    <text x="52" y="55" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#00D4FF">5+</text>
    <rect x="30" y="72" width="170" height="3" rx="1.5" fill="#0D2137"/>
    <rect x="30" y="72" width="0" height="3" rx="1.5" fill="url(#bar1)">
      <animate attributeName="width" from="0" to="170" dur="1.2s" begin="0.4s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 2: Languages -->
  <g style="animation: count-up 0.6s ease 0.4s both;">
    <circle cx="260" cy="38" r="3" fill="#7B2FBE">
      <animate attributeName="r" values="3;5;3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="272" y="35" font-family="monospace" font-size="9" fill="#8892A4" letter-spacing="1">LANGUAGES</text>
    <text x="272" y="55" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#7B2FBE">6+</text>
    <rect x="250" y="72" width="170" height="3" rx="1.5" fill="#1a1230"/>
    <rect x="250" y="72" width="0" height="3" rx="1.5" fill="url(#bar2)">
      <animate attributeName="width" from="0" to="155" dur="1.2s" begin="0.6s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 3: Startup -->
  <g style="animation: count-up 0.6s ease 0.6s both;">
    <circle cx="480" cy="38" r="3" fill="#3DDC84">
      <animate attributeName="r" values="3;5;3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="492" y="35" font-family="monospace" font-size="9" fill="#8892A4" letter-spacing="1">STARTUP</text>
    <text x="492" y="55" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#3DDC84">1</text>
    <rect x="470" y="72" width="170" height="3" rx="1.5" fill="#0d2a1f"/>
    <rect x="470" y="72" width="0" height="3" rx="1.5" fill="url(#bar3)">
      <animate attributeName="width" from="0" to="100" dur="1.2s" begin="0.8s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 4: DSA -->
  <g style="animation: count-up 0.6s ease 0.8s both;">
    <circle cx="700" cy="38" r="3" fill="#F7DF1E">
      <animate attributeName="r" values="3;5;3" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="712" y="35" font-family="monospace" font-size="9" fill="#8892A4" letter-spacing="1">DSA GRIND</text>
    <text x="712" y="55" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#F7DF1E">∞</text>
    <rect x="690" y="72" width="180" height="3" rx="1.5" fill="#2a2510"/>
    <rect x="690" y="72" width="0" height="3" rx="1.5" fill="url(#bar4)">
      <animate attributeName="width" from="0" to="180" dur="1.5s" begin="1s" fill="freeze"/>
    </rect>
  </g>
</svg>
