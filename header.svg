<svg width="900" height="300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @keyframes fade-up {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes border-glow {
        0%, 100% { stroke: #00D4FF; stroke-opacity: 0.5; }
        50% { stroke: #7B2FBE; stroke-opacity: 1; }
      }
      @keyframes slide-left {
        from { transform: translateX(-60px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slide-right {
        from { transform: translateX(60px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes name-glow {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080d16"/>
    </linearGradient>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="40%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <radialGradient id="cg" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- BG -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <ellipse cx="450" cy="128" rx="320" ry="130" fill="url(#cg)"/>

  <!-- Hex grid left -->
  <g opacity="0.05" fill="none" stroke="#00D4FF" stroke-width="0.5">
    <path d="M75,30 l16,9 v18 l-16,9 l-16,-9 v-18z"/>
    <path d="M120,30 l16,9 v18 l-16,9 l-16,-9 v-18z"/>
    <path d="M97,62 l16,9 v18 l-16,9 l-16,-9 v-18z"/>
  </g>
  <g opacity="0.05" fill="none" stroke="#00D4FF" stroke-width="0.5">
    <path d="M780,30 l16,9 v18 l-16,9 l-16,-9 v-18z"/>
    <path d="M825,30 l16,9 v18 l-16,9 l-16,-9 v-18z"/>
    <path d="M802,62 l16,9 v18 l-16,9 l-16,-9 v-18z"/>
  </g>
  <g opacity="0.04" fill="none" stroke="#7B2FBE" stroke-width="0.5">
    <path d="M75,215 l16,9 v18 l-16,9 l-16,-9 v-18z"/>
    <path d="M120,215 l16,9 v18 l-16,9 l-16,-9 v-18z"/>
    <path d="M780,215 l16,9 v18 l-16,9 l-16,-9 v-18z"/>
    <path d="M825,215 l16,9 v18 l-16,9 l-16,-9 v-18z"/>
  </g>

  <!-- Wave lines -->
  <path d="M0,138 Q150,108 300,138 Q450,168 600,138 Q750,108 900,138" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.07"/>
  <path d="M0,148 Q150,168 300,148 Q450,128 600,148 Q750,168 900,148" fill="none" stroke="#7B2FBE" stroke-width="0.6" opacity="0.05"/>

  <!-- Orbit rings -->
  <ellipse cx="450" cy="128" rx="370" ry="15" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.08" stroke-dasharray="6,8">
    <animateTransform attributeName="transform" type="rotate" from="0 450 128" to="360 450 128" dur="50s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="450" cy="128" rx="330" ry="19" fill="none" stroke="#7B2FBE" stroke-width="0.25" opacity="0.06" stroke-dasharray="4,10">
    <animateTransform attributeName="transform" type="rotate" from="360 450 128" to="0 450 128" dur="40s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Corner brackets -->
  <g stroke="#00D4FF" stroke-width="1.5" fill="none" opacity="0.5">
    <polyline points="12,32 12,12 32,12" style="animation: border-glow 3s ease-in-out infinite;"/>
    <polyline points="868,12 888,12 888,32" style="animation: border-glow 3s ease-in-out infinite; animation-delay:0.75s;"/>
    <polyline points="12,268 12,288 32,288" style="animation: border-glow 3s ease-in-out infinite; animation-delay:1.5s;"/>
    <polyline points="868,288 888,288 888,268" style="animation: border-glow 3s ease-in-out infinite; animation-delay:2.25s;"/>
  </g>

  <!-- Dashed border -->
  <rect x="6" y="6" width="888" height="288" rx="5" fill="none" stroke="#00D4FF" stroke-width="0.4" stroke-dasharray="10,5" opacity="0.12">
    <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Top label -->
  <text x="450" y="38" text-anchor="middle" font-family="monospace" font-size="9" fill="#58A6FF" opacity="0" style="animation: fade-up 0.8s ease 0.2s forwards;">[ DEVELOPER PROFILE ] - SYSTEM ONLINE</text>

  <!-- Left code -->
  <g style="animation: slide-left 1s ease 0.4s both;" font-family="monospace" font-size="8" fill="#3DDC84" opacity="0.18">
    <text x="22" y="78">fn main() &#123;</text>
    <text x="32" y="90">build();</text>
    <text x="32" y="102">deploy();</text>
    <text x="22" y="114">&#125;</text>
  </g>

  <!-- Right code -->
  <g style="animation: slide-right 1s ease 0.4s both;" font-family="monospace" font-size="8" fill="#7B2FBE" opacity="0.18" text-anchor="end">
    <text x="878" y="78">class App &#123;</text>
    <text x="868" y="90">init()</text>
    <text x="868" y="102">launch()</text>
    <text x="878" y="114">&#125;</text>
  </g>

  <!-- Main name -->
  <g style="animation: name-glow 3s ease-in-out infinite;">
    <text x="450" y="128" text-anchor="middle" font-family="monospace" font-size="56" font-weight="bold" fill="url(#ng)">NAZMEE JAWED</text>
  </g>

  <!-- Subtitle -->
  <text x="450" y="163" text-anchor="middle" font-family="monospace" font-size="14" fill="#58A6FF" opacity="0" style="animation: fade-up 0.8s ease 0.5s forwards;">Android  &#183;  Flutter  &#183;  Full Stack Developer</text>

  <!-- Divider line -->
  <line x1="320" y1="180" x2="580" y2="180" stroke="#161B22" stroke-width="1"/>
  <line x1="380" y1="180" x2="520" y2="180" stroke="#00D4FF" stroke-width="1" opacity="0.25">
    <animate attributeName="x1" values="380;320;380" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="520;580;520" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Tags -->
  <g style="animation: slide-left 0.8s ease 0.8s both;">
    <rect x="205" y="195" width="130" height="23" rx="11" fill="#0D2137" stroke="#163d5c" stroke-width="0.7"/>
    <text x="270" y="211" text-anchor="middle" font-family="monospace" font-size="10" fill="#58A6FF">Gurugram, India</text>
  </g>
  <g style="animation: fade-up 0.8s ease 1s both;">
    <rect x="350" y="195" width="105" height="23" rx="11" fill="#1a1230" stroke="#3d2080" stroke-width="0.7"/>
    <text x="402" y="211" text-anchor="middle" font-family="monospace" font-size="10" fill="#bf91f7">BCA 2026</text>
  </g>
  <g style="animation: slide-right 0.8s ease 0.8s both;">
    <rect x="470" y="195" width="150" height="23" rx="11" fill="#0d2a1f" stroke="#1a5c35" stroke-width="0.7"/>
    <text x="545" y="211" text-anchor="middle" font-family="monospace" font-size="10" fill="#56d364">Founder - Prepify</text>
  </g>

  <!-- Status line -->
  <g style="animation: fade-up 1s ease 1.2s both;" opacity="0">
    <text x="450" y="252" text-anchor="middle" font-family="monospace" font-size="11" fill="#3DDC84" opacity="0.9">&gt; Building in public | Code. Learn. Build. Repeat.</text>
  </g>

  <!-- Cursor -->
  <rect x="618" y="240" width="7" height="13" fill="#00D4FF" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles -->
  <circle cx="120" cy="145" r="2" fill="#00D4FF" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="135" r="2.5" fill="#7B2FBE" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="85" r="1.5" fill="#3DDC84" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;5,0;0,0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="240" r="1.5" fill="#F7DF1E" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;-5,0;0,0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="240" r="2" fill="#7B2FBE" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="75" r="2" fill="#3DDC84" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Version -->
  <text x="450" y="285" text-anchor="middle" font-family="monospace" font-size="8" fill="#30363d" opacity="0.5">v3.0 // nazmeejawed.dev</text>

</svg>
