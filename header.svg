<svg width="900" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes glow-pulse {
        0%, 100% { filter: drop-shadow(0 0 6px #00D4FF) drop-shadow(0 0 15px #00D4FF); }
        50% { filter: drop-shadow(0 0 15px #00D4FF) drop-shadow(0 0 40px #7B2FBE) drop-shadow(0 0 80px #00D4FF); }
      }
      @keyframes fade-up {
        0% { transform: translateY(20px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes border-glow {
        0%, 100% { stroke: #00D4FF; stroke-opacity: 0.5; }
        50% { stroke: #7B2FBE; stroke-opacity: 1; }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes wave {
        0% { d: path("M0,160 C150,120 300,200 450,160 C600,120 750,200 900,160"); }
        50% { d: path("M0,160 C150,200 300,120 450,160 C600,200 750,120 900,160"); }
        100% { d: path("M0,160 C150,120 300,200 450,160 C600,120 750,200 900,160"); }
      }
      @keyframes slide-in-left {
        0% { transform: translateX(-80px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      @keyframes slide-in-right {
        0% { transform: translateX(80px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -30; }
      }
      @keyframes particle-float {
        0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
        50% { transform: translateY(-15px) scale(1.3); opacity: 1; }
      }
      @keyframes hex-pulse {
        0%, 100% { opacity: 0.04; }
        50% { opacity: 0.12; }
      }
      @keyframes typing {
        0% { width: 0; }
        100% { width: 280px; }
      }
    </style>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="name-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00D4FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#7B2FBE" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#00D4FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg-grad)"/>
  
  <!-- Center radial glow -->
  <ellipse cx="450" cy="150" rx="350" ry="150" fill="url(#center-glow)"/>

  <!-- Subtle hex grid pattern -->
  <g opacity="0.04" style="animation: hex-pulse 4s ease-in-out infinite;">
    <path d="M100,40 l20,12 l0,24 l-20,12 l-20,-12 l0,-24 z" fill="none" stroke="#00D4FF" stroke-width="0.5"/>
    <path d="M160,40 l20,12 l0,24 l-20,12 l-20,-12 l0,-24 z" fill="none" stroke="#00D4FF" stroke-width="0.5"/>
    <path d="M130,82 l20,12 l0,24 l-20,12 l-20,-12 l0,-24 z" fill="none" stroke="#00D4FF" stroke-width="0.5"/>
    <path d="M740,40 l20,12 l0,24 l-20,12 l-20,-12 l0,-24 z" fill="none" stroke="#00D4FF" stroke-width="0.5"/>
    <path d="M800,40 l20,12 l0,24 l-20,12 l-20,-12 l0,-24 z" fill="none" stroke="#00D4FF" stroke-width="0.5"/>
    <path d="M770,82 l20,12 l0,24 l-20,12 l-20,-12 l0,-24 z" fill="none" stroke="#00D4FF" stroke-width="0.5"/>
    <path d="M100,220 l20,12 l0,24 l-20,12 l-20,-12 l0,-24 z" fill="none" stroke="#7B2FBE" stroke-width="0.5"/>
    <path d="M160,220 l20,12 l0,24 l-20,12 l-20,-12 l0,-24 z" fill="none" stroke="#7B2FBE" stroke-width="0.5"/>
    <path d="M740,220 l20,12 l0,24 l-20,12 l-20,-12 l0,-24 z" fill="none" stroke="#7B2FBE" stroke-width="0.5"/>
    <path d="M800,220 l20,12 l0,24 l-20,12 l-20,-12 l0,-24 z" fill="none" stroke="#7B2FBE" stroke-width="0.5"/>
  </g>

  <!-- Animated wave lines behind text -->
  <path d="M0,160 C150,130 300,190 450,160 C600,130 750,190 900,160" fill="none" stroke="url(#wave-grad)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="d" values="M0,160 C150,130 300,190 450,160 C600,130 750,190 900,160;M0,160 C150,190 300,130 450,160 C600,190 750,130 900,160;M0,160 C150,130 300,190 450,160 C600,130 750,190 900,160" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M0,160 C150,140 300,180 450,160 C600,140 750,180 900,160" fill="none" stroke="url(#wave-grad)" stroke-width="1" opacity="0.3">
    <animate attributeName="d" values="M0,160 C150,180 300,140 450,160 C600,180 750,140 900,160;M0,160 C150,140 300,180 450,160 C600,140 750,180 900,160;M0,160 C150,180 300,140 450,160 C600,180 750,140 900,160" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Orbital rings around center -->
  <g transform="translate(450, 145)">
    <ellipse cx="0" cy="0" rx="380" ry="18" fill="none" stroke="#00D4FF" stroke-width="0.4" opacity="0.15" stroke-dasharray="6,8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="340" ry="22" fill="none" stroke="#7B2FBE" stroke-width="0.3" opacity="0.12" stroke-dasharray="4,10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="35s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Corner tech accents - top left -->
  <g stroke="#00D4FF" stroke-width="1.5" fill="none" opacity="0.7">
    <polyline points="12,35 12,12 35,12" style="animation: border-glow 3s ease-in-out infinite;"/>
    <polyline points="865,12 888,12 888,35" style="animation: border-glow 3s ease-in-out infinite; animation-delay:0.75s;"/>
    <polyline points="12,285 12,308 35,308" style="animation: border-glow 3s ease-in-out infinite; animation-delay:1.5s;"/>
    <polyline points="865,308 888,308 888,285" style="animation: border-glow 3s ease-in-out infinite; animation-delay:2.25s;"/>
  </g>

  <!-- Animated dashed frame -->
  <rect x="6" y="6" width="888" height="308" rx="6" fill="none" stroke="#00D4FF" stroke-width="0.4" stroke-dasharray="10,5" opacity="0.2">
    <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top system label -->
  <text x="450" y="42" text-anchor="middle" font-family="monospace" font-size="9" fill="#58A6FF" opacity="0" letter-spacing="3" style="animation: fade-up 0.8s ease 0.2s forwards;">
    ⟨ DEVELOPER PROFILE ⟩ — SYSTEM ONLINE
  </text>

  <!-- Left decorative code snippet -->
  <g style="animation: slide-in-left 1s ease 0.5s both;" font-family="monospace" font-size="8" fill="#3DDC84" opacity="0.25">
    <text x="25" y="75">fn main() {</text>
    <text x="25" y="87">&nbsp;&nbsp;build();</text>
    <text x="25" y="99">&nbsp;&nbsp;deploy();</text>
    <text x="25" y="111">}</text>
  </g>

  <!-- Right decorative code snippet -->
  <g style="animation: slide-in-right 1s ease 0.5s both;" font-family="monospace" font-size="8" fill="#7B2FBE" opacity="0.25" text-anchor="end">
    <text x="875" y="75">class App {</text>
    <text x="875" y="87">&nbsp;&nbsp;init()</text>
    <text x="875" y="99">&nbsp;&nbsp;launch()</text>
    <text x="875" y="111">}</text>
  </g>

  <!-- Main name — gradient text -->
  <g style="animation: glow-pulse 4s ease-in-out infinite;">
    <text x="450" y="130" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="62" font-weight="bold" fill="url(#name-grad)" letter-spacing="4">
      NAZMEE JAWED
    </text>
  </g>

  <!-- Subtitle -->
  <text x="450" y="170" text-anchor="middle" font-family="monospace" font-size="14" fill="#8892A4" opacity="0" style="animation: fade-up 0.8s ease 0.6s forwards;" letter-spacing="1">
    Android  ·  Flutter  ·  Full Stack Developer
  </text>

  <!-- Divider line -->
  <line x1="300" y1="190" x2="600" y2="190" stroke="#161B22" stroke-width="1"/>
  <line x1="370" y1="190" x2="530" y2="190" stroke="#00D4FF" stroke-width="1" opacity="0.4" filter="url(#glow)">
    <animate attributeName="x1" values="370;300;370" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="530;600;530" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Tags row -->
  <g style="animation: slide-in-left 0.8s ease 0.9s both;">
    <rect x="195" y="205" width="135" height="24" rx="12" fill="#0D2137" stroke="#163d5c" stroke-width="0.8"/>
    <text x="262" y="221" text-anchor="middle" font-family="monospace" font-size="10" fill="#58A6FF">📍 Gurugram, India</text>
  </g>
  <g style="animation: fade-up 0.8s ease 1.1s both;">
    <rect x="345" y="205" width="108" height="24" rx="12" fill="#1a1230" stroke="#3d2080" stroke-width="0.8"/>
    <text x="399" y="221" text-anchor="middle" font-family="monospace" font-size="10" fill="#bf91f7">🎓 BCA · 2026</text>
  </g>
  <g style="animation: slide-in-right 0.8s ease 0.9s both;">
    <rect x="468" y="205" width="155" height="24" rx="12" fill="#0d2a1f" stroke="#1a5c35" stroke-width="0.8"/>
    <text x="545" y="221" text-anchor="middle" font-family="monospace" font-size="10" fill="#56d364">🧠 Founder · Prepify</text>
  </g>

  <!-- Bottom status line -->
  <g style="animation: fade-up 1s ease 1.4s both;" opacity="0">
    <text x="450" y="268" text-anchor="middle" font-family="monospace" font-size="11" fill="#3DDC84" opacity="0.9">
      &gt; Building in public 🚀 &#160;|&#160; Code. Learn. Build. Repeat.
    </text>
  </g>

  <!-- Blinking cursor -->
  <rect x="634" y="256" width="7" height="13" fill="#00D4FF" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles -->
  <circle cx="120" cy="150" r="2" fill="#00D4FF" style="animation: particle-float 3s ease-in-out infinite;"/>
  <circle cx="780" cy="140" r="2.5" fill="#7B2FBE" style="animation: particle-float 2.5s ease-in-out infinite; animation-delay: 0.5s;"/>
  <circle cx="200" cy="90" r="1.5" fill="#3DDC84" style="animation: particle-float 4s ease-in-out infinite; animation-delay: 1s;"/>
  <circle cx="700" cy="250" r="1.5" fill="#F7DF1E" style="animation: particle-float 3.5s ease-in-out infinite; animation-delay: 0.8s;"/>
  <circle cx="60" cy="250" r="2" fill="#7B2FBE" style="animation: particle-float 2.8s ease-in-out infinite; animation-delay: 1.2s;"/>
  <circle cx="840" cy="80" r="2" fill="#3DDC84" style="animation: particle-float 3.2s ease-in-out infinite; animation-delay: 0.3s;"/>
  <circle cx="350" cy="50" r="1" fill="#00D4FF" style="animation: particle-float 4.5s ease-in-out infinite; animation-delay: 2s;"/>
  <circle cx="550" cy="290" r="1" fill="#58A6FF" style="animation: particle-float 3.8s ease-in-out infinite; animation-delay: 1.5s;"/>

  <!-- Bottom version tag -->
  <text x="450" y="303" text-anchor="middle" font-family="monospace" font-size="8" fill="#30363d" opacity="0.8">
    v3.0 // nazmeejawed.dev
  </text>

</svg>
